<style>
html,body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
}

.hero{
  position:relative;
  height:700px;
  overflow:hidden;
  color:#fff;
  text-align:center;
}

video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  left:0;
  top:0;
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.42);
  pointer-events:none;
}

.content{
  position:relative;
  box-sizing:border-box;
  max-width:1000px;
  height:100%;
  margin:auto;
  padding:30px 35px;
  overflow-y:auto;
}

.welcome{
  font-size:20px;
  font-weight:bold;
}

.name{
  font-size:40px;
  font-weight:bold;
  margin:6px 0 20px;
}

h1{
  font-size:30px;
  margin:0 0 24px;
}

.text{
  font-size:17px;
  line-height:1.5;
}

.slogan{
  font-size:28px;
  font-weight:bold;
  margin-top:28px;
}

@media(max-width:768px){
  .content{padding:25px 20px}
  .welcome{font-size:18px}
  .name{font-size:34px;margin-bottom:18px}
  h1{font-size:26px;margin-bottom:20px}
  .text{font-size:16px}
  .slogan{font-size:24px;margin-top:24px}
}
</style>
